[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "native-ai-agent-guard"
version = "1.0.0"
description = "Multi-agent file/build/timing/evidence guard for Native AI FPGA development"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
native-guard = "native_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["native_guard*"]
